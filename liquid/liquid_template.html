<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#F4F1EA;}
  canvas{display:block;}
</style></head><body>
<canvas id="c" width="900" height="1200"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
// ===== THE LIQUID RENDERER (restored 2026-09-04) =====
// modes: pred (default) | recap | net
const DATA = __DATA__;
const W = 900, H = 1200, CREAM = '#F4F1EA';
const NAVY = '#003087', RED = '#ED171F', INK = '#1C2533', SUB = '#6B6557';
const B1 = 0, B2 = 120, B3 = 240, B4 = 420;      // frames @30fps, 16s total
const PFRAMES = 90, TRAIL = 16;
const cx = 450, cy = 600, rx = 275, ry = 415;    // oval field hugging the flow

const MODE = DATA.mode || 'pred';
const RECAP = MODE === 'recap', NET = MODE === 'net';
const SOFT = RECAP ? 0.88 : (NET ? 0.55 : 1.0); // layer softly for one-game data
const TN = DATA.teams.top.name, BN = DATA.teams.bottom.name;
const V = DATA.verdict || {}, R = DATA.result || {};
const gTop = DATA.goals.top, gBot = DATA.goals.bottom;
const topY = (0.90 - 0.80 * gTop[1]) * H;        // top goal px (data->canvas)
const botY = (0.90 - 0.80 * gBot[1]) * H;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng = mulberry32(20260904);

const SERIF = 'Times New Roman';      // resolves to Liberation Serif on this box
const SANS = 'Helvetica, Arial, sans-serif';
const NAVYINK = '#102030';            // editorial deep navy (wordmark / matchup / verdict)
const METAL = '#707060';              // taupe gray (metadata + captions)
const FAINT = '#A6A292';              // legend gray

function typeLine(txt, x, y, size, col, weight, ls, face){
  ctx.font = (weight === 'bold' ? '700 ' : (weight === 'light' ? '300 ' : '400 ')) + size + 'px ' + (face || SERIF);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = (ls || 0) + 'px';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2.5, size * 0.30);
  ctx.strokeStyle = CREAM; ctx.strokeText(txt, x, y);
  ctx.fillStyle = col; ctx.fillText(txt, x, y);
  ctx.letterSpacing = '0px';
}

// smooth a chain polyline through its own nodes (Catmull-Rom, uniform)
function smoothPath(pts){
  if (pts.length < 3) return pts;
  const out = [], P = pts;
  for (let i = 0; i < P.length - 1; i++){
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let s = 0; s < 10; s++){
      const t = s / 10;
      const t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  out.push(P[P.length - 1]);
  return out;
}

const flows = [];
for (const [end, col] of [['top', NAVY], ['bottom', RED]]){
  const arr = (DATA.ends[end] || {}).own || [];
  if (!arr.length) continue;
  let maxMS = 0.0001;
  for (const c of arr) maxMS = Math.max(maxMS, c.mS || 0);
  flows.push({end, col, paths: arr, startFrame: end === 'top' ? B1 : B2, maxMS});
}

// ---- chrome ---------------------------------------------------------------
function drawChrome(){
  ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W, H);
  // editorial serif masthead stack — matches the reference grammar
  typeLine('FINGERPRINT', cx, 33, 19, NAVYINK, 'bold', 1);
  typeLine((DATA.round_label || '').toUpperCase(), cx, 68, 10.5, METAL, 'normal', 1, SANS);
  typeLine(TN.toUpperCase() + ' v ' + BN.toUpperCase(), cx, 104, 15, NAVYINK, 'bold');
  // oval field
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
  ctx.fillStyle = '#F1EDE3'; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#DDD6C4'; ctx.stroke();
  for (const f of [0.32, 0.55, 0.78]){
    ctx.beginPath(); ctx.ellipse(cx, cy, rx*f, ry*f, 0, 0, 6.2832);
    ctx.lineWidth = 0.8; ctx.strokeStyle = '#E0DAC8'; ctx.stroke();
  }
}

// crisp anchor nodes — target icon: dark centre dot in a team-coloured ring
function drawAnchors(){
  for (const [gy, col] of [[topY, NAVY], [botY, RED]]){
    ctx.beginPath(); ctx.arc(cx, gy, 11, 0, 6.2832);
    ctx.lineWidth = 2.4; ctx.strokeStyle = col; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, gy, 8.5, 0, 6.2832);
    ctx.fillStyle = CREAM; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, gy, 5.5, 0, 6.2832);
    ctx.fillStyle = '#14181F'; ctx.fill();
  }
}

// ---- particle drawing -----------------------------------------------------
function drawStreak(col, hist, w, str){
  if (hist.length < 2 || str <= 0.01) return;
  const lw = Math.max(1.0, Math.min(3.4, 1.1 + 2.8 * Math.pow(w, 0.9)));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = col;
  // halo
  ctx.globalAlpha = Math.min(1, 0.085 * str);
  ctx.lineWidth = lw * 2.6;
  ctx.beginPath();
  for (let i = 0; i < hist.length; i++){ const p = hist[i]; i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
  ctx.stroke();
  // core
  ctx.globalAlpha = Math.min(1, 0.38 * str);
  ctx.lineWidth = lw;
  ctx.beginPath();
  for (let i = 0; i < hist.length; i++){ const p = hist[i]; i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

const particles = [];
function spawnEvery(weff){
  return Math.max(5, Math.min(34, Math.round(20 - 18 * Math.pow(weff, 0.45))));
}
function pointAt(pth, t){
  const L = pth._L, pts = pth.pts;
  const d = t * L[L.length - 1];
  let lo = 0, hi = L.length - 1;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; L[m] <= d ? lo = m : hi = m; }
  const f = (d - L[lo]) / Math.max(1e-6, L[hi] - L[lo]);
  return [pts[lo][0] + (pts[hi][0] - pts[lo][0]) * f, pts[lo][1] + (pts[hi][1] - pts[lo][1]) * f];
}
// unit tangent at t (for lateral weave offsets)
function tangentAt(pth, t){
  const L = pth._L, pts = pth.pts;
  const d = Math.min(L[L.length - 1] - 1e-6, Math.max(1e-6, t * L[L.length - 1]));
  let lo = 0, hi = L.length - 1;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; L[m] <= d ? lo = m : hi = m; }
  const dx = pts[hi][0] - pts[lo][0], dy = pts[hi][1] - pts[lo][1];
  const len = Math.hypot(dx, dy) || 1;
  return [dx / len, dy / len];
}
for (const f of flows){
  f.paths.forEach(p => {
    p.pts = smoothPath(p.pts);          // liquid curves through the real nodes
    const pts = p.pts; const L = [0];
    for (let i = 1; i < pts.length; i++)
      L.push(L[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
    p._L = L;
  });
}

let GMAX = 0.0001;                       // global matrix max — the net is between teams
for (const f of flows) for (const c of f.paths) GMAX = Math.max(GMAX, c.mS || 0);

let frame = 0;
function step(){
  const beat = frame < B2 ? 0 : frame < B3 ? 1 : frame < B4 ? 2 : 3;
  // long-exposure decay
  ctx.fillStyle = 'rgba(244,241,234,0.988)';
  ctx.fillRect(0, 0, W, H);
  drawChrome();
  const morph = frame >= B3 ? Math.min(1, (frame - B3) / 60) : 0;

  // spawn
  for (const flow of flows){
    if (frame < flow.startFrame) continue;
    const ramp = Math.min(1, (frame - flow.startFrame) / 25);
    const fi = flows.indexOf(flow);
    for (let ci = 0; ci < flow.paths.length; ci++){
      const pth = flow.paths[ci];
      if (pth.w <= 0.001) continue;
      let weff = pth.w2;                                   // matrix from frame one
      if (RECAP || NET) weff = Math.max(0.05, weff);
      else weff = Math.max(0.15, weff);
      const every = spawnEvery(Math.max(0.02, weff));
      if ((frame % every) === ((ci + fi) % every) && rng() < ramp){
        // hierarchy visible while drawing; the net landing sharpens it, never demolishes
        const sv = Math.max(0, pth.s2);
        const sFpre  = 0.90 + 0.10 * sv;
        const sFpost = 0.72 + 0.28 * sv;
        const sF = sFpre + (sFpost - sFpre) * morph;
        const msr = Math.max(0, pth.mS || 0) / GMAX;
        let str = sF * (0.25 + 0.75 * Math.pow(Math.min(1, msr), 0.6)) * SOFT;
        let pw = weff;
        if (RECAP || NET){ str *= (0.78 + 0.44 * rng()); pw *= (0.85 + 0.30 * rng()); }
        particles.push({flow: fi, ci, t: 0.002, spd: 0, hist: [], w: Math.max(0.05, pw), str,
                        off: 1.8 + 4.2 * rng(), ph: rng() * 6.2832, fr: 2.0 + 1.8 * rng(), die: null});
      }
    }
  }
  // move + draw
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    const flow = flows[p.flow], pth = flow.paths[p.ci];
    if (!p.spd) p.spd = (1 / PFRAMES) * (0.9 + 0.2 * rng());
    p.t += p.spd;
    const arrived = p.t >= 1;
    const raw = pointAt(pth, arrived ? 1 : p.t);
    // lateral weave — organic brush ribbon instead of a plotted line
    const tan = tangentAt(pth, Math.min(0.999, p.t));
    const wob = Math.sin(p.ph + p.t * p.fr * 6.2832);
    const pos = [raw[0] - tan[1] * p.off * wob, raw[1] + tan[0] * p.off * wob];
    p.hist.push(pos);
    if (p.hist.length > TRAIL) p.hist.shift();
    if (p.hist.length > 1){
      if (arrived && p.die == null) p.die = 5;
      const dF = p.die != null ? Math.max(0, p.die / 5) : 1;
      drawStreak(flow.col, p.hist, p.w, p.str * dF);
      if (p.die != null && --p.die <= 0){ particles.splice(i, 1); continue; }
    }
  }
  // trim runaway particles
  while (particles.length > 900) particles.shift();

  // caption / verdict -------------------------------------------------------
  // one narrative slot: phases during the draw, verdict reveal at the end
  const capY = 138;
  const verdictAt = B4;
  if (frame < verdictAt){
    if (beat === 0)
      typeLine(TN + (RECAP || NET ? '\u2019s real chains draw up' : '\u2019s chains draw up'), cx, capY, 12, METAL);
    else if (beat === 1)
      typeLine(BN + (RECAP || NET ? '\u2019s real chains draw down' : '\u2019s chains draw down'), cx, capY, 12, METAL);
    else if (beat === 2)
      typeLine(NET ? 'the net lands \u2014 routes the other end cancels drain to a drip'
                   : 'the model\u2019s subtraction \u2014 routes it cancels drain to a drip', cx, capY, 12, METAL);
  } else if (V.winner || R.home_name){
    const wName = (V.winner || (R.home_score >= R.away_score ? R.home_name : R.away_name) || '').toUpperCase();
    const wMar = NET ? Math.abs((R.home_score||0) - (R.away_score||0)) : Math.round(V.margin || 0);
    typeLine(wName, cx, 126, 26, NAVYINK, 'bold');
    typeLine('BY ' + wMar, cx, 161, 15, '#202020', 'bold', 1);
  }

  // inner end labels — solid cream plates (video layout: label BELOW top node,
  // ABOVE bottom node, plate blocks the flow, text crisp on top)
  function plate2(gy, txt){
    const y0 = gy > cy ? gy - 74 - 13 : gy + 74 - 13;
    ctx.beginPath();
    ctx.roundRect(cx - 135, y0, 270, 26, 13);
    ctx.fillStyle = CREAM; ctx.fill();
    typeLine(txt, cx, y0 + 13, 11, '#565047');
  }
  plate2(topY, 'WHERE ' + TN.toUpperCase() + ' SCORES');
  plate2(botY, 'WHERE ' + BN.toUpperCase() + ' SCORES');
  drawAnchors();

  // legend
  const own = TN.toUpperCase() + '\u2019s chains  \u00b7  red = ' + BN.toUpperCase() + '\u2019s chains';
  typeLine('navy = ' + own + '  \u00b7  flow = ' + (NET ? 'the actual net' : 'the model\u2019s net'), cx, 1126, 10.5, FAINT);
  typeLine(RECAP ? 'the subtraction lands \u2014 routes it cancels drain to a drip'
                 : (NET ? 'every real route weighed against the other end \u2014 the game draws its own verdict'
                        : 'thickness + glow = surviving weight \u00b7 faded = cancelled'),
           cx, 1150, 9.5, FAINT);

  frame++;
}
window.__advance = step;
step();
</script>
</body></html>
