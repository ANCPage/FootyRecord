<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#F4F1EA;}
  canvas{display:block;}
</style></head><body>
<canvas id="c" width="900" height="1200"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
// ===== THE LIQUID RENDERER (restored 2026-09-04) =====
// modes: pred (default) | recap | net
const DATA = __DATA__;
const W = 900, H = 1200, CREAM = '#F4F1EA';
const NAVY = '#003087', RED = '#ED171F', INK = '#1C2533', SUB = '#6B6557';
const B1 = 0, B2 = 120, B3 = 240, B4 = 420;      // frames @30fps, 16s total
const PFRAMES = 90, TRAIL = 16;
const cx = 450, cy = 600, rx = 275, ry = 415;    // oval field hugging the flow

const MODE = DATA.mode || 'pred';
const RECAP = MODE === 'recap', NET = MODE === 'net';
const SOFT = RECAP ? 0.88 : (NET ? 0.55 : 1.0); // layer softly for one-game data
const TN = DATA.teams.top.name, BN = DATA.teams.bottom.name;
const TCOL = {top: DATA.teams.top.colour || NAVY, bottom: DATA.teams.bottom.colour || RED};
const V = DATA.verdict || {}, R = DATA.result || {};
const gTop = DATA.goals.top, gBot = DATA.goals.bottom;
const topY = (0.90 - 0.80 * gTop[1]) * H;        // top goal px (data->canvas)
const botY = (0.90 - 0.80 * gBot[1]) * H;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng = mulberry32(20260904);

const SERIF = 'Times New Roman';      // resolves to Liberation Serif on this box
const SANS = 'Helvetica, Arial, sans-serif';
const NAVYINK = '#102030';            // editorial deep navy (wordmark / matchup / verdict)
const METAL = '#707060';              // taupe gray (metadata + captions)
const FAINT = '#A6A292';              // legend gray

function typeLine(txt, x, y, size, col, weight, ls, face){
  ctx.font = (weight === 'bold' ? '700 ' : (weight === 'light' ? '300 ' : '400 ')) + size + 'px ' + (face || SERIF);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = (ls || 0) + 'px';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2.5, size * 0.30);
  ctx.strokeStyle = CREAM; ctx.strokeText(txt, x, y);
  ctx.fillStyle = col; ctx.fillText(txt, x, y);
  ctx.letterSpacing = '0px';
}
// ---- motion helpers (animator pass 2026-09-05) ----
function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
const eOutQuad  = t => 1 - (1 - t) * (1 - t);
const eOutCubic = t => 1 - Math.pow(1 - t, 3);
const eOutQuint = t => 1 - Math.pow(1 - t, 5);
const eInCubic  = t => t * t * t;
const eOutExpo  = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
function lighten(hex, f){
  if (hex === '#FFFFFF' || hex === 'white') return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const m = c => Math.round(c + (255 - c) * f);
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
}

// smooth a chain polyline through its own nodes (Catmull-Rom, uniform)
function smoothPath(pts){
  if (pts.length < 3) return pts;
  const out = [], P = pts;
  for (let i = 0; i < P.length - 1; i++){
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let s = 0; s < 10; s++){
      const t = s / 10;
      const t2 = t * t, t3 = t2 * t;
      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  out.push(P[P.length - 1]);
  return out;
}

const flows = [];
for (const end of ['top', 'bottom']){ const col = TCOL[end];
  const arr = (DATA.ends[end] || {}).own || [];
  if (!arr.length) continue;
  let maxMS = 0.0001;
  for (const c of arr) maxMS = Math.max(maxMS, c.mS || 0);
  flows.push({end, col, paths: arr, startFrame: (end === 'top' ? B1 : B2) + 9, maxMS});
}

// ---- chrome ---------------------------------------------------------------
function drawChrome(){
  ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W, H);
  // editorial serif masthead stack — matches the reference grammar
  typeLine('FINGERPRINT', cx, 33, 19, NAVYINK, 'bold', 1);
  typeLine((DATA.round_label || '').toUpperCase(), cx, 68, 10.5, METAL, 'normal', 1, SANS);
  typeLine(TN.toUpperCase() + ' v ' + BN.toUpperCase(), cx, 104, 15, NAVYINK, 'bold');
  // oval field — the eye meets the field before the first head (0.7s ease-out)
  const fa = eOutQuad(clamp01(frame / 21));
  ctx.globalAlpha = fa;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
  ctx.fillStyle = '#F1EDE3'; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#DDD6C4'; ctx.stroke();
  for (const f of [0.32, 0.55, 0.78]){
    ctx.beginPath(); ctx.ellipse(cx, cy, rx*f, ry*f, 0, 0, 6.2832);
    ctx.lineWidth = 0.8; ctx.strokeStyle = '#E0DAC8'; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// crisp anchor nodes — target icon: dark centre dot in a team-coloured ring
function drawAnchors(){
  for (const [gy, col] of [[topY, TCOL.top], [botY, TCOL.bottom]]){
    ctx.beginPath(); ctx.arc(cx, gy, 11, 0, 6.2832);
    ctx.lineWidth = 2.4; ctx.strokeStyle = col; ctx.stroke();
    if (col === '#FFFFFF' || col === 'white'){
      ctx.beginPath(); ctx.arc(cx, gy, 11, 0, 6.2832);
      ctx.lineWidth = 1; ctx.strokeStyle = '#57534A'; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, gy, 8.5, 0, 6.2832);
    ctx.fillStyle = CREAM; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, gy, 5.5, 0, 6.2832);
    ctx.fillStyle = '#14181F'; ctx.fill();
  }
}

// ---- particle drawing -----------------------------------------------------
function drawStreak(col, hist, w, str, k){
  // k = concession drain (1 before the subtraction, ->0.45+0.55*s2 after):
  // BOTH channels reduce together — width thins AND opacity fades on cancelled routes.
  if (hist.length < 2 || str <= 0.01) return;
  let lw = Math.max(0.7, (Math.max(1.0, Math.min(3.4, 1.1 + 2.8 * Math.pow(w, 0.9)))) * k);
  const aK = 0.5 + 0.5 * k;
  const WHITE_RIBBON = col === '#FFFFFF' || col === 'white';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (!WHITE_RIBBON){
    ctx.strokeStyle = col;
    // halo
    ctx.globalAlpha = Math.min(1, 0.085 * str * aK);
    ctx.lineWidth = lw * 2.6;
    ctx.beginPath();
    for (let i = 0; i < hist.length; i++){ const p = hist[i]; i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
    ctx.stroke();
    // core
    ctx.globalAlpha = Math.min(1, 0.38 * str * aK);
    ctx.lineWidth = lw;
    ctx.beginPath();
    for (let i = 0; i < hist.length; i++){ const p = hist[i]; i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
    ctx.stroke();
  } else {
    // white clash guernsey: ink under-stroke + white core reads on cream
    ctx.strokeStyle = '#3A3732';
    ctx.globalAlpha = Math.min(1, 0.30 * str * aK);
    ctx.lineWidth = lw * 2.2;
    ctx.beginPath();
    for (let i = 0; i < hist.length; i++){ const p = hist[i]; i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
    ctx.stroke();
    ctx.strokeStyle = '#FFFFFF';
    ctx.globalAlpha = Math.min(1, 0.85 * str * aK);
    ctx.lineWidth = Math.max(0.8, lw - 0.4);
    ctx.beginPath();
    for (let i = 0; i < hist.length; i++){ const p = hist[i]; i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

const particles = [];
function spawnEvery(weff){
  return Math.max(5, Math.min(34, Math.round(20 - 18 * Math.pow(weff, 0.45))));
}
function pointAt(pth, t){
  const L = pth._L, pts = pth.pts;
  const d = t * L[L.length - 1];
  let lo = 0, hi = L.length - 1;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; L[m] <= d ? lo = m : hi = m; }
  const f = (d - L[lo]) / Math.max(1e-6, L[hi] - L[lo]);
  return [pts[lo][0] + (pts[hi][0] - pts[lo][0]) * f, pts[lo][1] + (pts[hi][1] - pts[lo][1]) * f];
}
// unit tangent at t (for lateral weave offsets)
function tangentAt(pth, t){
  const L = pth._L, pts = pth.pts;
  const d = Math.min(L[L.length - 1] - 1e-6, Math.max(1e-6, t * L[L.length - 1]));
  let lo = 0, hi = L.length - 1;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; L[m] <= d ? lo = m : hi = m; }
  const dx = pts[hi][0] - pts[lo][0], dy = pts[hi][1] - pts[lo][1];
  const len = Math.hypot(dx, dy) || 1;
  return [dx / len, dy / len];
}
for (const f of flows){
  f.paths.forEach(p => {
    p.pts = smoothPath(p.pts);          // liquid curves through the real nodes
    const pts = p.pts; const L = [0];
    for (let i = 1; i < pts.length; i++)
      L.push(L[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
    p._L = L;
  });
}

let GMAX = 0.0001;                       // global matrix max — the net is between teams
for (const f of flows) for (const c of f.paths) GMAX = Math.max(GMAX, c.mS || 0);

// per-route activation stagger (channels build organically, not all at once)
for (const f of flows){
  const fi = flows.indexOf(f);
  f.paths.forEach((p, ci) => {
    p._rs = Math.min(34, Math.floor(ci * 2.6) + ((ci * 13 + fi * 7) % 3)); // ~90-180ms apart
    const sv = Math.max(0, p.s2 || 0);
    // staged subtraction: survivors hold, middle routes get a fast 'suck',
    // the weakest ghosts ease out slowly, staggered by route hash
    p._kEnd = 0.45 + 0.55 * sv;
    if (sv >= 0.85) p._dr = {kind: 'hold'};
    else if (sv >= 0.40) p._dr = {kind: 'suck', t0: B3, dur: 21};
    else p._dr = {kind: 'ghost', t0: B3 + 21 + ((ci * 7 + fi * 3) % 20), dur: 54};
  });
}
function drainE(pth, fr){
  const d = pth._dr;
  if (d.kind === 'hold') return 1;
  if (fr < d.t0) return 0;
  const t = clamp01((fr - d.t0) / d.dur);
  return d.kind === 'suck' ? eOutCubic(t) : eOutQuint(t);
}

let frame = 0;
function step(){
  const beat = frame < B2 ? 0 : frame < B3 ? 1 : frame < B4 ? 2 : 3;
  // long-exposure decay
  ctx.fillStyle = 'rgba(244,241,234,0.988)';
  ctx.fillRect(0, 0, W, H);
  drawChrome();

  // spawn — routes activate staggered; cadence settles 10-14s so the verdict owns the frame
  for (const flow of flows){
    if (frame < flow.startFrame) continue;
    const ramp = Math.min(1, (frame - flow.startFrame) / 25);
    const fi = flows.indexOf(flow);
    const settle = frame >= 300 ? 1 + 0.25 * eInCubic(clamp01((frame - 300) / 120)) : 1;
    for (let ci = 0; ci < flow.paths.length; ci++){
      const pth = flow.paths[ci];
      if (pth.w <= 0.001) continue;
      const routeStart = flow.startFrame + pth._rs;
      if (frame < routeStart) continue;
      const dIn = eOutCubic(clamp01((frame - routeStart) / 21));  // ~700ms draw-in
      let weff = pth.w2;                                   // matrix from frame one
      if (RECAP || NET) weff = Math.max(0.05, weff);
      else weff = Math.max(0.15, weff);
      const every = Math.max(5, Math.round(spawnEvery(Math.max(0.02, weff)) * settle));
      if ((frame % every) === ((ci + fi) % every) && rng() < ramp){
        // hierarchy visible while drawing (two channels: width from w2, opacity from mS);
        // the subtraction beat then DRAINS cancelled routes on both channels (staged)
        const sv = Math.max(0, pth.s2);
        const sF = 0.90 + 0.10 * sv;
        const msr = Math.max(0, pth.mS || 0) / GMAX;
        let str = sF * (0.18 + 0.82 * Math.pow(Math.min(1, msr), 0.7)) * SOFT * dIn;
        let pw = weff;
        if (RECAP || NET){ str *= (0.78 + 0.44 * rng()); pw *= (0.85 + 0.30 * rng()); }
        particles.push({flow: fi, ci, born: frame, t: 0.002, spd: 0, hist: [], w: Math.max(0.05, pw), str,
                        off: 1.8 + 4.2 * rng(), ph: rng() * 6.2832, fr: 2.0 + 1.8 * rng(), die: null});
      }
    }
  }
  // move + draw
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    const flow = flows[p.flow], pth = flow.paths[p.ci];
    if (!p.spd) p.spd = (1 / PFRAMES) * (0.9 + 0.2 * rng());
    const ageF = clamp01((frame - p.born) / 12);          // spawn at rest, ramp to cruise
    p.t += p.spd * eOutQuad(ageF);
    const arrived = p.t >= 1;
    const raw = pointAt(pth, arrived ? 1 : p.t);
    // lateral weave — organic brush ribbon instead of a plotted line
    const tan = tangentAt(pth, Math.min(0.999, p.t));
    const wob = Math.sin(p.ph + p.t * p.fr * 6.2832);
    const pos = [raw[0] - tan[1] * p.off * wob, raw[1] + tan[0] * p.off * wob];
    p.hist.push(pos);
    if (p.hist.length > TRAIL) p.hist.shift();
    if (p.hist.length > 1){
      if (arrived && p.die == null) p.die = 5;
      const dF = p.die != null ? Math.max(0, p.die / 5) : 1;
      const k = 1 + (pth._kEnd - 1) * drainE(pth, frame);  // staged subtraction per route
      drawStreak(flow.col, p.hist, p.w, p.str * dF, k);
      // particle head: brighter leading tip so flow direction is legible
      if (p.die == null && flow.col !== '#FFFFFF' && flow.col !== 'white'){
        const H = p.hist;
        const hlw = Math.max(1.0, Math.min(3.4, 1.1 + 2.8 * Math.pow(p.w, 0.9)));
        ctx.strokeStyle = lighten(flow.col, 0.45);
        ctx.globalAlpha = Math.min(1, 0.5 * p.str * (0.5 + 0.5 * k));
        ctx.lineWidth = Math.max(1.0, hlw * 1.15);
        ctx.beginPath();
        const n0 = Math.max(0, H.length - 4);
        for (let h = n0; h < H.length; h++){ const q = H[h]; h === n0 ? ctx.moveTo(q[0], q[1]) : ctx.lineTo(q[0], q[1]); }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (p.die != null && --p.die <= 0){ particles.splice(i, 1); continue; }
    }
  }
  // trim runaway particles
  while (particles.length > 900) particles.shift();

  // caption / verdict -------------------------------------------------------
  // one narrative slot: phases during the draw (crossfaded, next line leads by ~300ms),
  // verdict reveal choreographed at the end (ease-out-expo + tracking settle)
  const capY = 138;
  const verdictAt = B4;
  if (frame < verdictAt){
    const caps = [
      TN + (RECAP || NET ? '\u2019s real chains draw up' : '\u2019s chains draw up'),
      BN + (RECAP || NET ? '\u2019s real chains draw down' : '\u2019s chains draw down'),
      NET ? 'the net lands \u2014 routes the other end cancels drain to a drip'
          : 'the model\u2019s subtraction \u2014 routes it cancels drain to a drip'
    ];
    const bs = [0, B2, B3][beat], ns = [B2, B3, verdictAt][beat];
    const aIn = clamp01((frame - Math.max(0, bs - 9)) / 12);
    const aOut = clamp01(((ns - 9) - frame) / 10);
    const capA = Math.min(aIn, aOut);
    if (capA > 0.01){
      ctx.globalAlpha = capA;
      typeLine(caps[beat], cx, capY - (1 - capA) * 8, 12, METAL);   // 8px rise on entry
      ctx.globalAlpha = 1;
    }
  } else if (V.winner || R.home_name){
    const wName = (V.winner || (R.home_score >= R.away_score ? R.home_name : R.away_name) || '').toUpperCase();
    const wMar = NET ? Math.abs((R.home_score||0) - (R.away_score||0)) : Math.round(V.margin || 0);
    const e1 = eOutExpo(clamp01((frame - verdictAt) / 15));          // name: 500ms ease-out-expo
    ctx.globalAlpha = e1;
    ctx.save();
    ctx.translate(cx, 126); ctx.scale(1.015 - 0.015 * e1, 1.015 - 0.015 * e1);
    typeLine(wName, 0, 0, 26, NAVYINK, 'bold');
    ctx.restore();
    ctx.globalAlpha = 1;
    const e2 = eOutExpo(clamp01((frame - (verdictAt + 9)) / 12));     // BY line 300ms later
    if (e2 > 0.01){
      ctx.globalAlpha = e2;
      typeLine('BY ' + wMar, cx, 161, 15, '#202020', 'bold', Math.round(7 - 6 * e2));  // tracking settles
      ctx.globalAlpha = 1;
    }
  }

  // inner end labels — solid cream plates (video layout: label BELOW top node,
  // ABOVE bottom node, plate blocks the flow, text crisp on top)
  function plate2(gy, txt){
    const y0 = gy > cy ? gy - 74 - 13 : gy + 74 - 13;
    ctx.beginPath();
    ctx.roundRect(cx - 135, y0, 270, 26, 13);
    ctx.fillStyle = CREAM; ctx.fill();
    typeLine(txt, cx, y0 + 13, 11, '#565047');
  }
  plate2(topY, 'WHERE ' + TN.toUpperCase() + ' SCORES');
  plate2(botY, 'WHERE ' + BN.toUpperCase() + ' SCORES');
  drawAnchors();

  // legend — colour chips + team names (worn colours from the exporter)
  const legY = 1126;
  const p1 = TN.toUpperCase() + '\u2019s chains', p2 = BN.toUpperCase() + '\u2019s chains';
  const p3 = '\u00b7  flow = ' + (NET ? 'the actual net' : 'the model\u2019s net');
  ctx.font = '400 10.5px ' + SERIF;
  const w1 = ctx.measureText(p1).width, w2 = ctx.measureText(p2).width, w3 = ctx.measureText(p3).width;
  const gap = 14, chip = 8, cg = 7;
  const total = chip + cg + w1 + gap + chip + cg + w2 + gap + w3;
  let x = cx - total / 2;
  function chipAt(xc, col){
    ctx.beginPath(); ctx.roundRect(xc, legY - chip / 2, chip, chip, 2); ctx.fillStyle = col; ctx.fill();
    if (col === '#FFFFFF' || col === 'white'){ ctx.lineWidth = 1; ctx.strokeStyle = '#57534A'; ctx.stroke(); }
  }
  chipAt(x, TCOL.top); x += chip + cg;
  typeLine(p1, x + w1 / 2, legY, 10.5, FAINT); x += w1 + gap;
  chipAt(x, TCOL.bottom); x += chip + cg;
  typeLine(p2, x + w2 / 2, legY, 10.5, FAINT); x += w2 + gap;
  typeLine(p3, x + w3 / 2, legY, 10.5, FAINT);
  typeLine(RECAP ? 'the subtraction lands \u2014 routes it cancels drain to a drip'
                 : (NET ? 'every real route weighed against the other end \u2014 the game draws its own verdict'
                        : 'thickness + glow = surviving weight \u00b7 faded = cancelled'),
           cx, 1150, 9.5, FAINT);

  frame++;
}
window.__advance = step;
step();
</script>
</body></html>
