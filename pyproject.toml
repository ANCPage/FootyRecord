[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footyrecord"
version = "0.3.0"
description = "AFL tactical prediction engine: spatial chain analysis, delta matchup model, Elo, visualizers, web dashboard"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "black>=24",
]

[tool.setuptools]
packages = ["Core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501: line length (deliberate compact style); E701/E702: one-liner style
# (intentional in this codebase). All real error checks stay active.
ignore = ["E501", "E701", "E702"]

[tool.black]
line-length = 100
target-version = ["py310"]
